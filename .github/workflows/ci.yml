name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Generate lockfile format and Action bundle
        run: |
          npm install
          npm run format
          npm run bundle:action
      - name: Commit generated entrypoint artifacts
        run: |
          git add package.json package-lock.json src tests scripts action-dist
          if git diff --cached --quiet; then
            echo "Generated entrypoint files are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock format and bundle entrypoints"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
