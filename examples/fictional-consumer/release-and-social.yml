name: FICTIONAL release-social consumer rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.synthetic.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release writer creates final body
        run: echo "FICTIONAL fixture: authored-final.md or generated.md becomes the one GitHub Release body."
      - name: Publish immutable GitHub Release
        id: synthetic
        run: |
          echo "FICTIONAL fixture only; a real consumer creates the stable release here."
          echo "release_id=515151" >> "$GITHUB_OUTPUT"

  validate-preview:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate canonical release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release-social validate --repository fictional/release-social-consumer --release-id "${{ needs.release.outputs.release_id }}" --config examples/fictional-consumer/config/both.json
      - name: Preview exact social text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release-social preview --repository fictional/release-social-consumer --release-id "${{ needs.release.outputs.release_id }}" --config examples/fictional-consumer/config/both.json

  package:
    needs: validate-preview
    runs-on: ubuntu-latest
    steps:
      - run: echo "FICTIONAL fixture: package/application release succeeds here."

  social:
    needs: [release, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-social-${{ github.repository_id }}-${{ needs.release.outputs.release_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aviaratech/release-social@REPLACE_WITH_REVIEWED_FULL_40_CHAR_COMMIT_SHA
        with:
          mode: publish
          repository: fictional/release-social-consumer
          release-id: ${{ needs.release.outputs.release_id }}
          config-path: examples/fictional-consumer/config/both.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
