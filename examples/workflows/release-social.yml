name: Release social announcement

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric GitHub Release ID
        required: true
        type: string
      mode:
        description: preview or publish
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: read

concurrency:
  group: release-social-${{ github.repository_id }}-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ inputs.mode == 'publish' && 'write' || 'read' }}
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use @v1 for the latest backwards-compatible v1. Pin a full release SHA for maximum assurance.
      - uses: aviaratech/release-social@v1
        with:
          mode: ${{ inputs.mode }}
          repository: ${{ github.repository }}
          release-id: ${{ inputs.release_id }}
          config-path: .github/release-social.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Non-secret destination identities can be centralized as repository or organization variables.
          X_ACCOUNT_ID: ${{ vars.X_ACCOUNT_ID }}
          LINKEDIN_AUTHOR: ${{ vars.LINKEDIN_AUTHOR }}
          # Provider credentials are exposed only for explicit publish mode. Never provide them to PR/fork checks.
          X_API_KEY: ${{ inputs.mode == 'publish' && secrets.X_API_KEY || '' }}
          X_API_SECRET: ${{ inputs.mode == 'publish' && secrets.X_API_SECRET || '' }}
          X_ACCESS_TOKEN: ${{ inputs.mode == 'publish' && secrets.X_ACCESS_TOKEN || '' }}
          X_ACCESS_TOKEN_SECRET: ${{ inputs.mode == 'publish' && secrets.X_ACCESS_TOKEN_SECRET || '' }}
          LINKEDIN_ACCESS_TOKEN: ${{ inputs.mode == 'publish' && secrets.LINKEDIN_ACCESS_TOKEN || '' }}
